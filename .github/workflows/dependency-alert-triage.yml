name: Dependency Alert Triage

on:
  schedule:
    - cron: '0 9 * * 1' # weekly Monday 09:00 UTC
  workflow_dispatch:

permissions:
  contents: read
  vulnerability-alerts: read # Dependabot alerts; security-events is code scanning only
  issues: write

concurrency:
  group: dependency-alert-triage
  cancel-in-progress: false

jobs:
  triage:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@f43a0e5ff2bd294095638e18286ca9a3d1956744 # v3
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '20'

      - name: Fetch open Dependabot alerts
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -o pipefail
          gh api \
            -H "Accept: application/vnd.github+json" \
            "/repos/${{ github.repository }}/dependabot/alerts?state=open&per_page=100" \
            --paginate --jq '.[]' | jq -s '.' > alerts.json

      - name: Summarize high/critical alerts
        run: node .github/scripts/summarize-alerts.js

      - name: Create or update tracking issue
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: node .github/scripts/upsert-alert-issue.js
