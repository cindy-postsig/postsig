  report:
    name: Report Results
    runs-on: ubuntu-latest
    needs: [quality, test]
    if: always()
    permissions:
      checks: write
      pull-requests: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          token: ${{ secrets.GA_TOKEN }}

      - name: Download test artifacts from all shards
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          pattern: test-results-shard-*
          merge-multiple: true

      - name: Merge test results from all shards
        uses: actions/github-script@f28e40c7f34bde8b3046d885e986cb6290c5673b # v7
        with:
          script: |
            const fs = require('fs');
            const path = require('path');

            const shardFiles = [1, 2, 3, 4].map(i => `test-results${i}.json`).filter(f => fs.existsSync(f));

            if (shardFiles.length === 0) {
              core.setFailed('No test result files found');
              return;
            }

            const mergedResults = {
              numTotalTests: 0,
              numPassedTests: 0,
              numFailedTests: 0,
              numPendingTests: 0,
              testResults: []
            };

            for (const file of shardFiles) {
              const shard = JSON.parse(fs.readFileSync(file, 'utf8'));
              mergedResults.numTotalTests += shard.numTotalTests || 0;
              mergedResults.numPassedTests += shard.numPassedTests || 0;
              mergedResults.numFailedTests += shard.numFailedTests || 0;
              mergedResults.numPendingTests += shard.numPendingTests || 0;
              if (shard.testResults) {
                mergedResults.testResults.push(...shard.testResults);
              }
            }

            fs.writeFileSync('test-results.json', JSON.stringify(mergedResults, null, 2));
            console.log(`Merged ${shardFiles.length} shard(s) into test-results.json`);

      - name: Merge coverage reports
        run: |
          if ls coverage-shard-*.lcov 1> /dev/null 2>&1; then
            cat coverage-shard-*.lcov > coverage.lcov
            echo "Merged coverage files into coverage.lcov"
          else
            echo "No coverage files found to merge"
          fi

      - name: Process test results and create job summary
        uses: actions/github-script@f28e40c7f34bde8b3046d885e986cb6290c5673b # v7
        with:
          script: |
            const fs = require('fs');
            if (!fs.existsSync('test-results.json')) {
              core.setFailed('Test results file not found');
              return;
            }

            const results = JSON.parse(fs.readFileSync('test-results.json'));

            let summary = '# 🧪 Test Results\n\n';
            summary += '## 📊 Summary\n\n';
            summary += `| Metric | Value |\n|--------|-------|\n`;
            summary += `| Total Tests | ${results.numTotalTests} |\n`;
            summary += `| Passed | ${results.numPassedTests} ✅ |\n`;
            summary += `| Failed | ${results.numFailedTests} ${results.numFailedTests > 0 ? '❌' : '✅'} |\n`;
            summary += `| Skipped | ${results.numPendingTests} ⏭️ |\n`;
            summary += `| Duration | ${results.testResults.reduce((acc, t) => acc + (t.endTime-t.startTime), 0)}ms |\n\n`;

            if (results.numFailedTests > 0) {
              summary += '## ❌ Failed Tests\n\n';
              results.testResults.forEach(suite => {
                suite.assertionResults.forEach(test => {
                  if (test.status === 'failed') {
                    summary += `### ${test.fullName}\n`;
                    summary += '```\n';
                    summary += test.failureMessages.join('\n');
                    summary += '\n```\n\n';
                  }
                });
              });
            }

            await core.summary.addRaw(summary).write();

            if (results.numFailedTests > 0) {
              core.setFailed(`${results.numFailedTests} test(s) failed`);
            }

      - name: Comment test results on PR
        if: github.event_name == 'pull_request'
        uses: actions/github-script@f28e40c7f34bde8b3046d885e986cb6290c5673b # v7
        with:
          script: |
            const fs = require('fs');
            if (!fs.existsSync('test-results.json')) {
              console.log('Test results not available for PR comment');
              return;
            }

            const results = JSON.parse(fs.readFileSync('test-results.json'));

            let commentBody = '## 🧪 Test Results\n\n';

            const status = results.numFailedTests === 0 ? '✅ PASSED' : '❌ FAILED';
            const color = results.numFailedTests === 0 ? '36a64f' : 'd73a49';
            commentBody += `![Test Status](https://img.shields.io/badge/Tests-${encodeURIComponent(status)}-${color})\n\n`;

            commentBody += '### 📊 Summary\n\n';
            commentBody += '| Metric | Value |\n';
            commentBody += '|--------|-------|\n';
            commentBody += `| Total Tests | ${results.numTotalTests} |\n`;
            commentBody += `| Passed | ${results.numPassedTests} ✅ |\n`;
            commentBody += `| Failed | ${results.numFailedTests} ${results.numFailedTests > 0 ? '❌' : '✅'} |\n`;
            commentBody += `| Skipped | ${results.numPendingTests} ⏭️ |\n`;

            const duration = results.testResults ? results.testResults.reduce((acc, t) => acc + (t.perfStats?.runtime || 0), 0) : 0;
            commentBody += `| Duration | ${duration}ms |\n\n`;

            const passRate = results.numTotalTests > 0 ? (results.numPassedTests / results.numTotalTests * 100).toFixed(1) : 0;
            const progressBar = '█'.repeat(Math.floor(passRate / 5)) + '░'.repeat(20 - Math.floor(passRate / 5));
            commentBody += `### 🎯 Success Rate: ${passRate}%\n`;
            commentBody += `\`${progressBar}\`\n\n`;

            if (results.numFailedTests > 0) {
              commentBody += '### ❌ Failed Tests\n\n';
              results.testResults.forEach(suite => {
                suite.assertionResults.forEach(test => {
                  if (test.status === 'failed') {
                    commentBody += `<details>\n<summary><strong>${test.fullName}</strong></summary>\n\n`;
                    commentBody += '```\n';
                    commentBody += test.failureMessages.join('\n');
                    commentBody += '\n```\n</details>\n\n';
                  }
                });
              });
            }

            commentBody += `---\n*🤖 Generated by [${context.workflow}](${context.payload.repository.html_url}/actions/runs/${context.runId}) at ${new Date().toISOString()}*`;

            const { data: comments } = await github.rest.issues.listComments({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
            });

            const botComment = comments.find(comment => 
              comment.user.type === 'Bot' && comment.body.includes('🧪 Test Results')
            );

            if (botComment) {
              await github.rest.issues.updateComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                comment_id: botComment.id,
                body: commentBody
              });
            } else {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: context.issue.number,
                body: commentBody
              });
            }

      - name: Check overall pipeline status
        if: always()
        run: |
          if [[ "${{ needs.quality.result }}" == "failure" || "${{ needs.test.result }}" == "failure" ]]; then
            echo "❌ Pipeline failed - check individual job results"
            exit 1
          else
            echo "✅ All pipeline jobs completed successfully"
          fi
