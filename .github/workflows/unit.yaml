name: Continuous Integration

on:
  push:
    branches: [main, staging, development]
  pull_request:
    branches: [main, staging, development]

permissions: {}

jobs:
  setup:
    name: Setup Dependencies
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      cache-key: ${{ steps.cache-deps.outputs.cache-hit }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          token: ${{ secrets.GA_TOKEN }}

      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22.x'
          cache: 'npm'

      - name: Authenticate to GitHub npm registry
        run: echo "//npm.pkg.github.com/:_authToken=${{ secrets.GA_TOKEN }}" > ~/.npmrc

      - name: Configure Tiptap Registry
        run: |
          npm config set @tiptap-pro:registry https://registry.tiptap.dev/
          npm config set //registry.tiptap.dev/:_authToken ${{ secrets.TIPTAP_AUTH_TOKEN }}

      - name: Install dependencies
        id: cache-deps
        run: npm ci

      - name: Cache node_modules
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: node_modules
          key: ${{ runner.os }}-node-22-${{ hashFiles('package-lock.json') }}

  quality:
    name: Code Quality Checks
    runs-on: ubuntu-latest
    needs: setup
    permissions:
      contents: read
    strategy:
      matrix:
        check: [lint, format, typecheck]
    steps:
      - name: Checkout repository
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22.x'
          cache: 'npm'

      - name: Restore dependencies
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: node_modules
          key: ${{ runner.os }}-node-22-${{ hashFiles('package-lock.json') }}

      - name: Install dependencies (fallback)
        run: npm ci

      - name: Configure registries
        run: |
          echo "//npm.pkg.github.com/:_authToken=${{ secrets.GA_TOKEN }}" > ~/.npmrc
          npm config set @tiptap-pro:registry https://registry.tiptap.dev/
          npm config set //registry.tiptap.dev/:_authToken ${{ secrets.TIPTAP_AUTH_TOKEN }}

      - name: Run linting
        if: matrix.check == 'lint'
        run: npm run lint

      - name: Check code formatting
        if: matrix.check == 'format'
        run: npm run prettier:check || echo "Formatting issues found - see job summary"

      - name: Type checking
        if: matrix.check == 'typecheck'
        env:
          NODE_OPTIONS: '--max_old_space_size=4096'
        run: npx tsc --noEmit

  test:
    name: Unit Tests
    runs-on: ubuntu-latest
    needs: setup
    permissions:
      checks: write
      pull-requests: write
    strategy:
      fail-fast: false
      matrix:
        shard_index: [1, 2, 3, 4]
    steps:
      - name: Checkout repository
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          token: ${{ secrets.GA_TOKEN }}

      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22.x'
          cache: 'npm'

      - name: Restore dependencies
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: node_modules
          key: ${{ runner.os }}-node-22-${{ hashFiles('package-lock.json') }}

      - name: Configure registries
        run: |
          echo "//npm.pkg.github.com/:_authToken=${{ secrets.GA_TOKEN }}" > ~/.npmrc
          npm config set @tiptap-pro:registry https://registry.tiptap.dev/
          npm config set //registry.tiptap.dev/:_authToken ${{ secrets.TIPTAP_AUTH_TOKEN }}

